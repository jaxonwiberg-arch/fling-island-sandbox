<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fling Island Sandbox</title>
<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;background:#72c9f4}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;color:#fff;pointer-events:none}.stats{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}.panel{padding:8px 14px;border:1px solid #ffffff40;border-radius:14px;background:#101827bb;text-align:center;backdrop-filter:blur(8px)}small{display:block;font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}.panel b{font-size:1.45rem}.help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#101827aa;font-size:.78rem;white-space:nowrap;z-index:5}.help.mobile{font-size:.7rem;padding:6px 10px;white-space:normal;max-width:240px}.modal{pointer-events:auto;position:absolute;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100% - 28px));padding:25px;border:1px solid #ffffff40;border-radius:24px;background:#07101ddd;text-align:center}.modal h1{margin:0 0 8px;font-size:clamp(2rem,8vw,3.5rem)}.modal p{line-height:1.5;opacity:.85}.modal button{border:0;border-radius:999px;padding:13px 26px;color:#fff;font-weight:800;background:linear-gradient(135deg,#38d5ff,#7165ff);font-size:1rem;cursor:pointer}.hidden{display:none!important}#joypad,#fling-zone{display:none;position:fixed;z-index:50;pointer-events:auto;touch-action:none}#joypad{left:16px;bottom:20px;width:100px;height:100px;border:2px solid #ffffff99;border-radius:50%;background:#07101db3}#joypad.visible{display:flex;align-items:center;justify-content:center}#joypad-knob{position:absolute;width:36px;height:36px;border:2px solid white;border-radius:50%;background:linear-gradient(135deg,#70ddff,#5ac8ff);left:50%;top:50%;transform:translate(-50%,-50%)}#fling-zone{right:0;bottom:0;width:50%;height:55%;z-index:40}#fling-zone.visible{display:block}#fling-zone.active{background:radial-gradient(circle at center,#ff4b4d26,#ff4b4d00)}#fling-indicator{position:fixed;z-index:45;width:60px;height:60px;border:2px solid #ff514d;border-radius:50%;background:#ff4b4d1a;pointer-events:none;display:none}.visible{display:block!important}@media(min-width:701px){#joypad,#fling-zone,#fling-indicator{display:none!important}.help.mobile{display:none}}@media(max-width:700px){.help:not(.mobile){display:none}.stats{top:10px}.panel{padding:6px 10px}.panel b{font-size:1.2rem}}
</style>
</head>
<body><div id="app"></div><div id="ui"><div class="stats"><div class="panel"><small>Fling score</small><b id="score">0</b></div><div class="panel"><small>Objects</small><b id="count">0</b></div></div><div class="help">WASD / arrows move · drag toward an object, then aim up or down · E ride train</div><div class="help mobile">Left: Move · Right: Drag up/down to fling · Walk near the train and tap E</div><div id="modal" class="modal"><h1>Fling Island</h1><p>Explore the island, ride the train, and fling nearby NPCs and crates into the water.</p><button id="play">Enter island</button></div></div><div id="joypad"><div id="joypad-knob"></div></div><div id="fling-zone"></div><div id="fling-indicator"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),play=$('#play'),joy=$('#joypad'),knob=$('#joypad-knob'),zone=$('#fling-zone'),indicator=$('#fling-indicator'),scoreEl=$('#score'),countEl=$('#count');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x73caf5);scene.fog=new THREE.Fog(0x73caf5,70,180);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,400),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdff6ff,0x31503b,1.4));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(35,70,25);sun.castShadow=true;scene.add(sun);const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.84}),R=43,objects=[],keys={},move=new THREE.Vector2(),clock=new THREE.Clock();let playing=false,score=0,drag=false,dragId=null,joyId=null,riding=false,isMobile=innerWidth<=700;
const water=new THREE.Mesh(new THREE.CircleGeometry(130,96),M(0x1974b9));water.rotation.x=-Math.PI/2;water.position.y=-1;scene.add(water);const island=new THREE.Mesh(new THREE.CylinderGeometry(R+3,R+5,10,64),M(0x765738));island.receiveShadow=true;scene.add(island);const grass=new THREE.Mesh(new THREE.CylinderGeometry(R,R+1,1.2,64),M(0x42aa4b));grass.position.y=5.55;grass.receiveShadow=true;scene.add(grass);
function hill(x,z,s){const h=new THREE.Mesh(new THREE.SphereGeometry(7,24,16),M(0x5b913d));h.scale.set(1.4,s*.35,1.4);h.position.set(x,5.8+s*.15,z);h.castShadow=true;scene.add(h)}[[-15,-11,4],[18,9,3.5],[5,-22,2.8],[-23,16,4.2]].forEach(x=>hill(...x));
function tree(x,z){const t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.36,4,9),M(0x81522f));t.position.set(x,7,z);t.castShadow=true;scene.add(t);for(let i=0;i<6;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.7,2.5,5),M(0x20a84b));l.position.set(x,9.3,z);l.rotation.set(0,i*Math.PI/3,Math.PI/2);scene.add(l)}}for(let i=0;i<30;i++){const a=i*Math.PI*2/30,r=THREE.MathUtils.randFloat(18,37);tree(Math.cos(a)*r,Math.sin(a)*r)}
const player=new THREE.Group();player.position.set(0,7,0);scene.add(player);function part(m,x,y,z){m.position.set(x,y,z);m.castShadow=true;player.add(m)}part(new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.48),M(0x3b82f6)),0,0,0);part(new THREE.Mesh(new THREE.SphereGeometry(.34,16,16),M(0xf4c9aa)),0,1.05,0);part(new THREE.Mesh(new THREE.CylinderGeometry(.35,.42,.13,16),M(0xfacc15)),0,1.48,0);for(const x of[-.18,.18])part(new THREE.Mesh(new THREE.CapsuleGeometry(.11,.9,5,8),M(0x172033)),x,-1,0);
function person(c){const g=new THREE.Group();g.userData.v=new THREE.Vector3();const b=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.45),M(c));b.position.y=.8;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.32,14,14),M(0xf1c6a6));h.position.y=1.85;g.add(h);for(const x of[-.48,.48]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.08,.7,5,8),M(0x202a3b));a.position.set(x,.8,0);a.rotation.z=x>0?-.75:.75;g.add(a)}for(const x of[-.18,.18]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.1,.8,5,8),M(0x202a3b));l.position.set(x,-.15,0);g.add(l)}return g}function crate(){const g=new THREE.Group();g.userData.v=new THREE.Vector3();const b=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.35,1.35),M(0xb87838));b.position.y=.68;g.add(b);return g}for(let i=0;i<18;i++){const o=Math.random()<.65?person([0xff6b6b,0x60a5fa,0xfacc15,0x34d399][i%4]):crate(),a=Math.random()*Math.PI*2,r=THREE.MathUtils.randFloat(7,35);o.position.set(Math.cos(a)*r,6,Math.sin(a)*r);o.traverse(x=>{if(x.isMesh)x.castShadow=true});scene.add(o);objects.push(o)}countEl.textContent=objects.length;
const train=new THREE.Group();for(let i=0;i<3;i++){const car=new THREE.Mesh(new THREE.BoxGeometry(2,1.2,3.4),M(i?0xdc263d:0xb91c35));car.position.set(0,.7,-i*3.7);car.castShadow=true;train.add(car)}scene.add(train);const route=new THREE.CatmullRomCurve3([new THREE.Vector3(0,6,33),new THREE.Vector3(33,6,0),new THREE.Vector3(0,6,-33),new THREE.Vector3(-33,6,0)],true,'catmullrom',.15);let trainT=0;function updateTrain(dt){trainT=(trainT+dt*.018)%1;const p=route.getPointAt(trainT),n=route.getPointAt((trainT+.002)%1);train.position.copy(p);const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),n.clone().sub(p).normalize());train.quaternion.slerp(q,Math.min(1,dt*5));if(riding){player.position.copy(train.position).add(new THREE.Vector3(0,2.6,0).applyQuaternion(train.quaternion));player.quaternion.copy(train.quaternion)}}
const aim=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xff514d}));aim.visible=false;scene.add(aim);const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),aimDir=new THREE.Vector3(),end=new THREE.Vector3();function aimAt(x,y){const r=renderer.domElement.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height*2-1));ray.setFromCamera(ndc,camera);aimDir.copy(ray.ray.direction);const start=player.position.clone().add(new THREE.Vector3(0,.8,0));end.copy(start).addScaledVector(aimDir,Math.min(24,Math.max(7,18/Math.max(.2,Math.abs(aimDir.y)))));end.y=THREE.MathUtils.clamp(end.y,6,24);aim.geometry.setFromPoints([start,end]);aim.visible=true;if(isMobile){indicator.style.left=x-30+'px';indicator.style.top=y-30+'px';indicator.classList.add('visible')}}function fling(){const start=player.position.clone(),dir=end.clone().sub(start);dir.y*=.65;const length=dir.length();if(length<2)return;dir.normalize();let target=null,best=Infinity;for(const o of objects){const to=o.position.clone().sub(start);to.y=0;const along=to.dot(dir);const side=to.clone().addScaledVector(dir,-along).length();if(along>0&&along<16&&side<3.2&&along<best){best=along;target=o}}if(!target)return;const power=THREE.MathUtils.clamp(5+length*.28,5,10);target.userData.v.addScaledVector(dir,power);target.userData.v.y+=THREE.MathUtils.clamp((end.y-start.y)*.35, -1.5, 4);target.userData.v.y=Math.min(target.userData.v.y,7)}
function movement(){if(riding)return;let x=0,z=0;if(keys.w||keys.arrowup)z--;if(keys.s||keys.arrowdown)z++;if(keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;x+=move.x;z+=move.y;if(x||z){const l=Math.hypot(x,z);x/=l;z/=l;player.position.x+=x*.3;player.position.z+=z*.3;player.rotation.y=Math.atan2(x,z)}const d=Math.hypot(player.position.x,player.position.z),max=R-6;if(d>max){const a=Math.atan2(player.position.z,player.position.x);player.position.x=Math.cos(a)*max;player.position.z=Math.sin(a)*max}}
function toggleRide(){if(!playing)return;if(riding){riding=false;scene.add(player);player.position.copy(train.position).add(new THREE.Vector3(3,2,0));return}if(player.position.distanceTo(train.position)<6){riding=true;train.add(player)}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleRide()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener('pointerup',()=>{joyId=null;move.set(0,0);knob.style.transform='translate(-50%,-50%)'});function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-50,dy=e.clientY-r.top-50,d=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);knob.style.transform=`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px))`;move.set(Math.cos(a)*d/40,Math.sin(a)*d/40)}
renderer.domElement.onpointerdown=e=>{if(playing&&!isMobile){drag=true;dragId=e.pointerId;aimAt(e.clientX,e.clientY)}};renderer.domElement.onpointermove=e=>{if(drag&&e.pointerId===dragId)aimAt(e.clientX,e.clientY)};renderer.domElement.onpointerup=e=>{if(drag&&e.pointerId===dragId){drag=false;fling();aim.visible=false}};zone.onpointerdown=e=>{if(playing){e.preventDefault();drag=true;zone.classList.add('active');aimAt(e.clientX,e.clientY)}};addEventListener('pointermove',e=>{if(drag)aimAt(e.clientX,e.clientY)});addEventListener('pointerup',()=>{if(drag){drag=false;zone.classList.remove('active');fling();aim.visible=false;indicator.classList.remove('visible')}});
function update(dt){movement();updateTrain(dt);for(const o of objects){const v=o.userData.v;v.y-=.22*dt*60;o.position.addScaledVector(v,dt*60);v.x*=Math.pow(.988,dt*60);v.z*=Math.pow(.988,dt*60);if(o.position.y<6){o.position.y=6;v.y*=-.18}if(Math.hypot(o.position.x,o.position.z)>R+4&&o.position.y<0){scoreEl.textContent=++score;o.position.set(THREE.MathUtils.randFloatSpread(45),6,THREE.MathUtils.randFloatSpread(45));v.set(0,0,0)}}}function loop(){const dt=Math.min(clock.getDelta(),.033);if(playing)update(dt);const cp=riding?train.position:player.position;camera.position.lerp(new THREE.Vector3(cp.x,cp.y+8,cp.z+12),.08);camera.lookAt(cp.x,cp.y+.5,cp.z);renderer.render(scene,camera);requestAnimationFrame(loop)}play.onclick=()=>{playing=true;modal.classList.add('hidden');if(isMobile){joy.classList.add('visible');zone.classList.add('visible')}};addEventListener('resize',()=>{isMobile=innerWidth<=700;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop();
</script></body></html>
